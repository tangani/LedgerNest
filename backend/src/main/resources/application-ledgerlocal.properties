# Activated explicitly with MICRONAUT_ENVIRONMENTS=ledgerlocal.
# Local development only. JWT authentication is required for financial records.
micronaut.server.host=127.0.0.1
micronaut.server.port=8080
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.frontend.allowed-origins[0]=http://localhost:5173
micronaut.server.cors.configurations.frontend.allowed-methods[0]=GET
micronaut.server.cors.configurations.frontend.allowed-methods[1]=POST
micronaut.server.cors.configurations.frontend.allowed-methods[2]=PUT
micronaut.server.cors.configurations.frontend.allowed-methods[3]=OPTIONS
micronaut.server.cors.configurations.frontend.allowed-headers[0]=Content-Type
datasources.default.url=jdbc:postgresql://localhost:5433/ledgernest
datasources.default.username=ledgernest
datasources.default.password=ledgernest_local_only
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.dialect=POSTGRES
datasources.default.maximum-pool-size=5
flyway.datasources.default.enabled=true
flyway.datasources.default.locations=classpath:db/migration

micronaut.server.cors.configurations.frontend.allowed-headers[1]=Authorization
