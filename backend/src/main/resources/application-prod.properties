micronaut.server.host=0.0.0.0
micronaut.server.port=${PORT:8080}

datasources.default.url=${JDBC_DATABASE_URL}
datasources.default.username=${DB_USERNAME}
datasources.default.password=${DB_PASSWORD}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.dialect=POSTGRES
datasources.default.maximum-pool-size=5

flyway.datasources.default.enabled=true
flyway.datasources.default.locations=classpath:db/migration

# Browser API requests will go through the Vercel proxy.
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.android.allowed-origins[0]=https://localhost
micronaut.server.cors.configurations.android.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
micronaut.server.cors.configurations.android.allowed-headers=Authorization,Content-Type,Accept
micronaut.server.cors.configurations.android.allow-credentials=false