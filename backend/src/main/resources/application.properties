#Wed Oct 14 02:22:00 UTC 2026
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
flyway.datasources.default.enabled=true
micronaut.application.name=ledgernest

# Fail startup when no signing secret is configured. Do not commit a real secret.
micronaut.security.enabled=true
micronaut.security.authentication=bearer
micronaut.security.endpoints.login.path=/api/v1/auth/login
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_GENERATOR_SIGNATURE_SECRET}
micronaut.security.token.jwt.signatures.secret.generator.jws-algorithm=HS256
micronaut.security.token.generator.access-token.expiration=900
micronaut.security.endpoints.logout.enabled=false
micronaut.security.basic-auth.enabled=false